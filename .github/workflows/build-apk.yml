name: Build APK

on:
  push:
    branches:
      - main
      - claude/dnd-ai-app-android-qpx768
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneQuest-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: ArcaneQuest APK (latest build)
          body: |
            Latest ArcaneQuest build. Download `app-release.apk` below, open it on
            your Android phone (allow "install from unknown sources" if prompted),
            and play. Works out of the box — no API key needed.
          prerelease: false
          files: app/build/outputs/apk/release/app-release.apk
